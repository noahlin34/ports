[package]
name = "ports"
version = "0.1.0"
edition = "2021"
description = "A macOS-first port and socket inspector"
readme = "README.md"
license = "MIT"
repository = "https://github.com/noahlin34/ports"
rust-version = "1.82"

[lib]
name = "ports"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
arboard = "3"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
open = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
